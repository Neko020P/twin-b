# Experiment Configuration: Boochoo Resolution Building - Exam Period
# Scenario: Midterm/Final exam weeks with concentrated schedules
# Location: Thammasat University Lampang Campus, Thailand

experiment:
  name: "boochoo_exam_period_lampang"
  description: "Exam period with 665 agents, concentrated occupancy in exam halls"
  version: "1.0"
  created_date: "2025-01-15"

# Building Configuration
building:
  name: "Boochoo Resolution Building"
  idf_file: "path/to/Boochoo_Resolution_Building.idf"
  zones_config: "zones_boochoo_building.yaml"
  total_zones: 70
  floors: 5

# Weather Data
weather:
  location: "Lampang, Thailand"
  epw_file: "THA_NRG_Lampang.Airport.483280_TMYx.2009-2023.epw"
  wmo_station: "483280"
  climate_type: "Tropical Savanna (Aw)"
  description: "Lampang Airport weather data 2009-2023"

# Agent Configuration
agents:
  config_file: "agents_exam_period.json"
  total_agents: 665
  agent_types:
    - undergraduate: 500
    - graduate: 40
    - faculty: 45
    - admin_staff: 35
    - lab_technician: 10
    - cleaner: 20
    - security: 10
    - visitor: 5

# Simulation Parameters
simulation:
  steps: 288
  start_time: "08:00"
  end_time: "18:00"
  timestep_minutes: 5
  warmup_days: 7
  simulation_days: 14  # Two-week exam period

# Output Configuration
output:
  results_directory: "results/boochoo_exam_lampang"
  save_agent_results: true
  save_zone_results: true
  save_energy_results: true
  create_visualizations: true
  export_formats: ["csv", "json"]

# Notes
notes: |
  Exam period simulation with students concentrated in large halls for 2-3 hour blocks.
  Lower comfort tolerance due to stress and concentration requirements.
  Enhanced cleaning between exam sessions.
  Expected long continuous occupancy periods with minimal movement.
